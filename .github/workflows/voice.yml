name: voice
on:
  workflow_dispatch:
    inputs:
      ep: {description: "episode folder", default: "episodes/ep00-onecoin-test"}
      only: {description: "line ids, e.g. 3,4,5 (blank = all)", default: ""}
      takes: {description: "max takes per line", default: "2"}
      fetch_weights: {description: "download weights to volume first (once)", type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: heavy-worker, cancel-in-progress: false}   # never two heavy jobs at once
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q modal
      - name: Run on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          export MODAL_TOKEN_ID="$(printf '%s' "$MODAL_TOKEN_ID" | tr -d '[:space:]')"
          export MODAL_TOKEN_SECRET="$(printf '%s' "$MODAL_TOKEN_SECRET" | tr -d '[:space:]')"
          if [ "${{ inputs.fetch_weights }}" = "true" ]; then modal run machine/worker_voice.py::fetch_weights; fi
          modal run machine/worker_voice.py::voice --ep "${{ inputs.ep }}" --only "${{ inputs.only }}" --takes "${{ inputs.takes }}"
      - name: Publish output to worker-out branch (overwritten each run)
        run: |
          cd out && git init -q -b worker-out && git add -A
          git -c user.name=wisdrop-bot -c user.email=bot@users.noreply.github.com commit -qm "voice ${{ inputs.ep }} ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" worker-out
